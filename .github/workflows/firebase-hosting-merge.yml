# FlutterをビルドしてFirebase Hostingへ自動デプロイ

name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # GitHubのコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Flutterをセットアップ
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      # Flutterの依存関係を取得
      - name: Flutter Pub Get
        run: flutter pub get

      # Flutter Webをビルド
      - name: Build Flutter Web
        run: flutter build web

      # Firebase Hostingへデプロイ
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SONG_SEARCH_RUKAWAGOD }}
          channelId: live
          projectId: song-search-rukawagod
          
